<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Magarsa Belemo Payment</title>

<style>
body{
font-family:sans-serif;
max-width:500px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input,button{
width:100%;
padding:12px;
margin-top:10px;
}

button{
background:#0088ff;
color:white;
border:none;
border-radius:8px;
}
</style>
</head>
<body>

<div class="card">

<h2>Magarsa Belemo</h2>

<p>
Send any amount to:
</p>

<h3>0931454841  </h3>

<input
id="amount"
placeholder="Amount Paid">

<input
id="receipt"
placeholder="Receipt Number">

<button onclick="verifyPayment()">
Verify Payment
</button>

<p id="result"></p>

</div>

<script>
async function verifyPayment(){

const amount =
document.getElementById("amount").value;

const receipt =
document.getElementById("receipt").value;

const response =
await fetch("/api/verify",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
amount,
receipt
})
});

const data = await response.json();

document.getElementById("result").innerText =
data.message;
}
</script>

</body>
</html>
